<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription - 100% Digital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #050510; color: #fff; }
    .auth-container { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 12px; border: 1px solid rgba(0, 229, 255, 0.2); width: 100%; max-width: 400px; text-align: center; }
    .auth-container h2 { margin-bottom: 20px; color: #00e5ff; }
    .auth-container input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none; background: rgba(255,255,255,0.1); color: #fff; }
    .auth-container button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #00e5ff; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .auth-container button:hover { background: #fff; box-shadow: 0 0 15px rgba(0,229,255,0.5); }
    .auth-links { margin-top: 15px; font-size: 0.9rem; }
    .auth-links a { color: #00e5ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Inscription Admin</h2>
    <form id="registerForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Mot de passe" required>
      <select id="role" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none; background: rgba(255,255,255,0.1); color: #fff;">
        <option value="user" style="color: #000;">Utilisateur (Visiteur)</option>
        <option value="admin" style="color: #000;">Administrateur</option>
      </select>
      <button type="submit">Créer le compte</button>
    </form>
    <div class="auth-links">
      <p>Déjà un compte ? <a href="login.html">Se connecter</a></p>
      <p><a href="index.html">← Retour au site</a></p>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await res.json();
        
        if (data.success) {
          alert('Compte créé ! Vous pouvez maintenant vous connecter.');
          window.location.href = 'login.html';
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Erreur lors de l\'inscription');
      }
    });
  </script>
</body>
</html>
