<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - 100% Digital Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #050510; color: #fff; }
    .auth-container { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 12px; border: 1px solid rgba(0, 229, 255, 0.2); width: 100%; max-width: 400px; text-align: center; }
    .auth-container h2 { margin-bottom: 20px; color: #00e5ff; }
    .auth-container input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none; background: rgba(255,255,255,0.1); color: #fff; }
    .auth-container button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #00e5ff; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .auth-container button:hover { background: #fff; box-shadow: 0 0 15px rgba(0,229,255,0.5); }
    .auth-links { margin-top: 15px; font-size: 0.9rem; }
    .auth-links a { color: #00e5ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Connexion Admin</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
    <div class="auth-links">
      <p>Pas de compte ? <a href="register.html">S'inscrire</a></p>
      <p><a href="index.html">← Retour au site</a></p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          if (data.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Erreur de connexion');
      }
    });
  </script>
</body>
</html>
