<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - 100% Digital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #050510; color: #fff; font-family: 'Outfit', sans-serif; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; margin-bottom: 20px; }
    h1 { color: #00e5ff; }
    button.logout { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    .admin-container { display: flex; gap: 30px; flex-wrap: wrap; }
    .form-section, .list-section { flex: 1; min-width: 300px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
    .form-section h2, .list-section h2 { margin-bottom: 15px; color: #fff; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #cfd6ff; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 5px; border: none; background: rgba(0,0,0,0.5); color: #fff; }
    .btn-submit { background: #00e5ff; color: #000; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
    
    .card-item { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #00e5ff; }
    .card-item h4 { margin: 0; color: #fff; }
    .card-item p { margin: 5px 0 0 0; font-size: 0.8rem; color: #aaa; }
    .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>Tableau de Bord Administrateur</h1>
    <div>
      <a href="index.html" style="color:#00e5ff; margin-right: 20px; text-decoration:none;">Voir le site</a>
      <button class="logout" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="admin-container" style="margin-bottom: 30px;">
    <div class="list-section" style="flex: 100%;">
      <h2>Gestion des Utilisateurs</h2>
      <div id="usersList">Chargement...</div>
    </div>
  </div>

  <div class="admin-container">
    <div class="form-section">
      <h2>Ajouter une nouvelle réalisation / service</h2>
      <form id="addCardForm">
        <div class="form-group">
          <label>Type de contenu (Page)</label>
          <select id="page" required>
            <option value="evenements">Événements (Réalisations)</option>
            <option value="services">Services</option>
          </select>
        </div>
        <div class="form-group">
          <label>Titre</label>
          <input type="text" id="title" required placeholder="Ex: Clip Audiovisuel">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="description" rows="3" required placeholder="Description..."></textarea>
        </div>
        <div class="form-group">
          <label>Badge (Optionnel)</label>
          <input type="text" id="badge" placeholder="Ex: Vidéo Cinématique">
        </div>
        <div class="form-group">
          <label>Média (Image ou Vidéo)</label>
          <input type="file" id="mediaFile" accept="image/*,video/*" required>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Ajouter au site</button>
      </form>
    </div>

    <div class="list-section">
      <h2>Contenus Actuels</h2>
      <div id="cardsList">Chargement...</div>
    </div>
  </div>

  <script>
    // Vérifier l'authentification
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    if (!token || role !== 'admin') {
      alert("Accès refusé. Vous devez être administrateur.");
      window.location.href = 'index.html';
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = 'login.html';
    }

    async function loadCards() {
      const res = await fetch('/api/cards');
      const cards = await res.json();
      const container = document.getElementById('cardsList');
      container.innerHTML = '';
      
      if(cards.length === 0) {
        container.innerHTML = '<p>Aucun contenu trouvé.</p>';
      }

      cards.forEach(card => {
        container.innerHTML += `
          <div class="card-item">
            <div>
              <h4>${card.title} <span style="font-size:0.7rem; color:#00e5ff;">[${card.page}]</span></h4>
              <p>${card.description}</p>
            </div>
            <button class="btn-delete" onclick="deleteCard(${card.id})">Supprimer</button>
          </div>
        `;
      });
    }

    document.getElementById('addCardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Téléchargement...';
      btn.disabled = true;

      try {
        const fileInput = document.getElementById('mediaFile');
        const file = fileInput.files[0];
        
        if (!file) {
          alert('Veuillez sélectionner un fichier.');
          return;
        }

        // 1. Upload du fichier
        const formData = new FormData();
        formData.append('file', file);

        const uploadRes = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: formData
        });

        const uploadData = await uploadRes.json();
        
        if (!uploadData.success) {
          alert("Erreur lors de l'upload du fichier : " + uploadData.error);
          btn.innerHTML = originalText;
          btn.disabled = false;
          return;
        }

        const fileUrl = uploadData.fileUrl;
        const isVideo = file.type.startsWith('video/');

        // 2. Création de la carte avec l'URL reçue
        const payload = {
          page: document.getElementById('page').value,
          title: document.getElementById('title').value,
          description: document.getElementById('description').value,
          badge: document.getElementById('badge').value,
          image_url: isVideo ? '' : fileUrl,
          video_url: isVideo ? fileUrl : ''
        };

        const res = await fetch('/api/cards', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(payload)
        });

        if(res.ok) {
          e.target.reset();
          loadCards();
        } else {
          alert('Erreur lors de l\'ajout de la carte');
        }
      } catch (error) {
        console.error(error);
        alert('Erreur réseau');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });

    async function deleteCard(id) {
      if(confirm('Supprimer cet élément ?')) {
        const res = await fetch('/api/cards/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if(res.ok) loadCards();
      }
    }

    async function loadUsers() {
      const res = await fetch('/api/users', { headers: { 'Authorization': 'Bearer ' + token } });
      const users = await res.json();
      const container = document.getElementById('usersList');
      container.innerHTML = '';
      
      if(users.length === 0) {
        container.innerHTML = '<p>Aucun utilisateur trouvé.</p>';
      }

      users.forEach(user => {
        let buttons = '';
        if (user.role === 'admin') {
          buttons += `<button class="btn-submit" style="width:auto; margin-right:5px; background:#f39c12; color:white;" onclick="changeRole(${user.id}, 'user')">👤 Rétrograder</button>`;
        } else {
          buttons += `<button class="btn-submit" style="width:auto; margin-right:5px;" onclick="changeRole(${user.id}, 'admin')">👑 Promouvoir Admin</button>`;
        }
        buttons += `<button class="btn-delete" onclick="deleteUser(${user.id})">🗑️ Supprimer</button>`;

        container.innerHTML += `
          <div class="card-item">
            <div>
              <h4>${user.email}</h4>
              <p>Rôle : <strong style="color: ${user.role === 'admin' ? '#00e5ff' : '#aaa'}">${user.role.toUpperCase()}</strong></p>
            </div>
            <div>${buttons}</div>
          </div>
        `;
      });
    }

    async function changeRole(id, newRole) {
      if(confirm('Changer le rôle de cet utilisateur ?')) {
        const res = await fetch('/api/users/' + id + '/role', {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token 
          },
          body: JSON.stringify({ role: newRole })
        });
        if(res.ok) {
          loadUsers();
        } else {
          const data = await res.json();
          alert(data.error);
        }
      }
    }

    async function deleteUser(id) {
      if(confirm('Supprimer définitivement cet utilisateur ?')) {
        const res = await fetch('/api/users/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if(res.ok) {
          loadUsers();
        } else {
          const data = await res.json();
          alert(data.error);
        }
      }
    }

    loadCards();
    loadUsers();
  </script>
</body>
</html>
